<script>
/* ================= STORAGE (localStorage — 100% offline) ================= */
function lsGet(key, fallback){
  try { var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e){ return false; } }

/* ================= IMAGE STORAGE (IndexedDB — sin el límite de tamaño de localStorage) =================
   Las imágenes YA NO se guardan como base64 dentro de las operaciones/estudios en localStorage.
   Cada operación/estudio guarda solo un ID por imagen; el contenido real vive en IndexedDB. */
var IMG_DB_NAME = 'hm_images_db', IMG_STORE = 'images';
var imgDbPromise = null;
function openImgDb(){
  if (imgDbPromise) return imgDbPromise;
  imgDbPromise = new Promise(function(resolve, reject){
    if (!window.indexedDB) { reject(new Error('IndexedDB no disponible en este navegador')); return; }
    var req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE, { keyPath: 'id' });
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
  return imgDbPromise;
}
function imgPut(id, dataUrl){
  return openImgDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).put({ id: id, dataUrl: dataUrl });
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function imgGet(id){
  return openImgDb().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(IMG_STORE, 'readonly');
      var req = tx.objectStore(IMG_STORE).get(id);
      req.onsuccess = function(){ resolve(req.result ? req.result.dataUrl : null); };
      req.onerror = function(){ resolve(null); };
    });
  });
}
function imgGetMany(ids){
  var uniq = Array.from(new Set((ids||[]).filter(Boolean)));
  if (!uniq.length) return Promise.resolve({});
  return Promise.all(uniq.map(function(id){ return imgGet(id).then(function(url){ return {id:id, url:url}; }); }))
    .then(function(results){
      var map = {};
      results.forEach(function(r){ if (r.url) map[r.id] = r.url; });
      return map;
    }).catch(function(){ return {}; });
}
function imgDelete(id){
  return openImgDb().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).delete(id);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
    });
  }).catch(function(){ return false; });
}
function imgGetAll(){
  return openImgDb().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(IMG_STORE, 'readonly');
      var req = tx.objectStore(IMG_STORE).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ resolve([]); };
    });
  }).catch(function(){ return []; });
}
function newImgId(){ return 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function autoExpandTextarea(el, maxHeightPx){
  if (!el) return;
  var max = maxHeightPx || 480;
  var resize = function(){
    el.style.height = 'auto';
    var h = el.scrollHeight;
    if (h > max) { el.style.height = max + 'px'; el.style.overflowY = 'auto'; }
    else { el.style.height = h + 'px'; el.style.overflowY = 'hidden'; }
  };
  resize();
  requestAnimationFrame(resize);
  el.addEventListener('input', resize);
  window.addEventListener('resize', resize);
}

// Agrega archivos nuevos: comprime, guarda cada uno en IndexedDB, cachea en memoria para render inmediato,
// y empuja solo el ID dentro del arreglo de la operación/estudio.
function addImagesToArray(idArray, files, doneCb){
  compressMany(files, 900, 0.65, function(dataUrls){
    if (!dataUrls.length) { doneCb(); return; }
    var puts = dataUrls.map(function(dataUrl){
      var id = newImgId();
      state.imageCache[id] = dataUrl;
      idArray.push(id);
      return imgPut(id, dataUrl).catch(function(){ /* queda en memoria esta sesión aunque falle el guardado en IndexedDB */ });
    });
    Promise.all(puts).then(doneCb).catch(doneCb);
  });
}
function removeImageFromArray(idArray, idx){
  var id = idArray[idx];
  idArray.splice(idx,1);
  if (id) { imgDelete(id); delete state.imageCache[id]; }
}

// Migración única de imágenes viejas (base64 guardado directo en localStorage) hacia IndexedDB.
// No borra nada hasta confirmar que la nueva copia se guardó correctamente.
function migrateLegacyImages(){
  if (lsGet('hm_images_migrated_v1', false)) return Promise.resolve();
  if (!window.indexedDB) return Promise.resolve();
  var jobs = [];

  function migrateArray(arr){
    if (!Array.isArray(arr)) return Promise.resolve();
    var tasks = [];
    for (var i=0;i<arr.length;i++){
      (function(i){
        var v = arr[i];
        if (typeof v === 'string' && v.indexOf('data:image') === 0) {
          var id = newImgId();
          tasks.push(imgPut(id, v).then(function(){ arr[i] = id; }).catch(function(){ /* deja el base64 si falla, no se pierde */ }));
        }
      })(i);
    }
    return Promise.all(tasks);
  }

  var ops = loadOperations();
  var opsTasks = ops.map(function(op){
    return Promise.all([
      migrateArray(op.imagenesAntes), migrateArray(op.imagenesDurante), migrateArray(op.imagenesResultado)
    ]);
  });
  jobs.push(Promise.all(opsTasks).then(function(){ saveOperations(ops); }));

  var idx = loadStudiesIndex();
  var studyTasks = idx.map(function(meta){
    var study = loadStudy(meta.id);
    if (!study) return Promise.resolve();
    var ranges = [study.h4].concat(study.h1||[]).concat(study.m15||[]);
    return Promise.all(ranges.map(function(r){ return migrateArray(r && r.images); })).then(function(){ saveStudy(study); });
  });
  jobs.push(Promise.all(studyTasks));

  return Promise.all(jobs).then(function(){ lsSet('hm_images_migrated_v1', true); }).catch(function(){ /* se reintenta en el próximo arranque */ });
}

function collectImageIdsFromOperation(op){
  return [].concat(op.imagenesAntes||[], op.imagenesDurante||[], op.imagenesResultado||[]);
}
function collectImageIdsFromStudy(study){
  var ranges = [study.h4].concat(study.h1||[]).concat(study.m15||[]);
  var ids = [];
  ranges.forEach(function(r){ if (r && r.images) ids = ids.concat(r.images); });
  return ids;
}
function openOperationForEdit(op){
  var copy = JSON.parse(JSON.stringify(op));
  imgGetMany(collectImageIdsFromOperation(copy)).then(function(map){
    Object.assign(state.imageCache, map);
    state.editingOp = copy;
    goTo('diario-form');
  });
}
function openStudyForView(study){
  imgGetMany(collectImageIdsFromStudy(study)).then(function(map){
    Object.assign(state.imageCache, map);
    state.currentStudy = study; state.studyTF='h4'; state.studyRangeId=null;
    goTo('biblioteca-study');
  });
}
// Resuelve el src real de una imagen a partir de su ID (o, si aún no se migró, del base64 directo)
var PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="68"><rect width="90" height="68" fill="%231B1C22"/></svg>';
function resolveImgSrc(idOrDataUrl){
  if (!idOrDataUrl) return PLACEHOLDER_IMG;
  if (idOrDataUrl.indexOf('data:image') === 0) return idOrDataUrl; // legado, aún no migrado
  return state.imageCache[idOrDataUrl] || PLACEHOLDER_IMG;
}

function loadAccounts(){
  var a = lsGet('hm_accounts', null);
  if (a && a.length) return a;
  var def = [{ id: 'acc_default', name: 'Cuenta Demo', type: 'Demo', currency: 'USD', balanceInicial: 0 }];
  lsSet('hm_accounts', def);
  return def;
}
function saveAccounts(a){ lsSet('hm_accounts', a); }
function loadOperations(){ return lsGet('hm_operations', []); }
function saveOperations(ops){ lsSet('hm_operations', ops); }
function loadMovements(accId){ return lsGet('hm_movements_' + accId, []); }
function saveMovements(accId, mv){ lsSet('hm_movements_' + accId, mv); }
function loadGoal(accId){ return lsGet('hm_goal_' + accId, null); }
function saveGoal(accId, g){ lsSet('hm_goal_' + accId, g); }
function loadGoalHistory(accId){ return lsGet('hm_goal_history_' + accId, []); }
function saveGoalHistory(accId, gh){ lsSet('hm_goal_history_' + accId, gh); }
function loadTaxRate(accId){ var v = lsGet('hm_taxrate_' + accId, null); return v===null ? 15 : v; }
function saveTaxRate(accId, r){ lsSet('hm_taxrate_' + accId, r); }
function loadTaxPayments(accId){ return lsGet('hm_taxpay_' + accId, []); }
function saveTaxPayments(accId, p){ lsSet('hm_taxpay_' + accId, p); }
function loadStudiesIndex(){ return lsGet('hm_studies_index', []); }
function saveStudiesIndex(s){ lsSet('hm_studies_index', s); }
function loadStudy(id){ return lsGet('hm_study_' + id, null); }
function saveStudy(study){ lsSet('hm_study_' + study.id, study); }
function deleteStudyStorage(id){ try { localStorage.removeItem('hm_study_' + id); } catch(e){} }
function loadChecklistTemplate(){
  var t = lsGet('hm_checklist_template', null);
  if (t && t.length) return t;
  var def = [
    { id:'q1', text:'¿Hubo finalización?', type:'boolean' },
    { id:'q2', text:'¿Hubo barrida de liquidez?', type:'boolean' },
    { id:'q3', text:'¿Dónde está el POI?', type:'text' },
    { id:'q4', text:'¿Está en Premium o Discount?', type:'text' },
    { id:'q5', text:'¿Cuál es la dirección esperada?', type:'text' },
    { id:'q6', text:'¿Hubo BOS?', type:'boolean' },
    { id:'q7', text:'¿Hubo CHoCH?', type:'boolean' },
    { id:'q8', text:'¿Hubo mitigación?', type:'boolean' },
    { id:'q9', text:'¿Qué esperas que haga el precio?', type:'text' },
  ];
  lsSet('hm_checklist_template', def);
  return def;
}
function saveChecklistTemplate(t){ lsSet('hm_checklist_template', t); }

/* ================= DATA ================= */
var ASSETS = {
  'Forex': ['EUR/USD','GBP/USD','USD/JPY','USD/CAD','AUD/USD'],
  'Metales': ['XAU/USD (Oro)','XAG/USD'],
  'Índices': ['US30','NAS100','SPX500'],
  'Materias primas': ['USOIL','UKOIL'],

};
var RISK_CHECKLIST = [
  '¿Estás completamente seguro de tomar esta operación?','¿El POI es Decisional?','¿El POI es Extremo?',
  '¿Sacó Liquidez?','¿Tiene Imbalance?','¿Desde ese Order Block nació un movimiento fuerte?',
  '¿Está alineado con la temporalidad mayor?','¿Está dentro del rango correcto?',
  '¿Está en Premium o Discount?','¿Cumple todas mis reglas?'
];

  '¿Hubo vela de confirmación clara?','¿Ruptura de estructura confirmada (BOS/CHoCH)?',
  '¿Hubo retest exitoso del nivel?','¿El momentum está a favor de la dirección?',
  '¿Hay confluencia con la temporalidad mayor?','¿Está en Premium o Discount?','¿Cumple todas mis reglas?'
];
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var DIAS_SEMANA = ['L','M','X','J','V','S','D'];

var state = {
  view: 'home',
  accounts: loadAccounts(),
  selectedAccountId: null,
  operations: loadOperations(),
  editingOp: null,
  filterCuenta: 'Todas',
  statsScope: 'Todas',
  calScope: 'Todas',
  calCursor: (function(){ var d = new Date(); d.setDate(1); return d; })(),
  movements: [], goal: null, goalHistory: [],
  taxRate: 15, taxPayments: [],
  checklistTemplate: loadChecklistTemplate(),
  studiesIndex: loadStudiesIndex(),
  currentStudy: null,
  studyTF: 'h4', studyRangeId: null,
  imageCache: {},
};
state.selectedAccountId = lsGet('hm_selected_account', null) || state.accounts[0].id;
loadAccountScoped();

function loadAccountScoped(){
  var id = state.selectedAccountId;
  state.movements = loadMovements(id);
  state.goal = loadGoal(id);
  state.goalHistory = loadGoalHistory(id);
  state.taxRate = loadTaxRate(id);
  state.taxPayments = loadTaxPayments(id);
}
function getAccount(id){ return state.accounts.find(function(a){ return a.id === id; }); }
function currentAccount(){ return getAccount(state.selectedAccountId); }

function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowHM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
function fmtMoney(amount, currency){
  amount = parseFloat(amount) || 0;
  try { return new Intl.NumberFormat('es-ES', { style:'currency', currency: currency||'USD', maximumFractionDigits:2 }).format(amount); }
  catch(e){ return (amount>=0?'':'') + amount.toFixed(2) + ' ' + (currency||''); }
}
function fmtNum(n){ n = parseFloat(n)||0; return (n>=0?'+':'') + n.toFixed(2); }

function emptyOperation(cuenta){
  return {
    id: uid('op'), cuenta: cuenta, fecha: todayISO(), hora: nowHM(),
    categoria: 'Forex', activo: 'EUR/USD', activoManual: '',
    direccion: 'Compra', lotaje: '', riesgo: '', precioEntrada: '', stopLoss: '', takeProfit: '', rr: '',
    resultado: 'Ganada', beneficio: '',
    tipoEntrada: 'Riesgo', checklist: {}, observaciones: '',
    imagenesAntes: [], imagenesDurante: [], imagenesResultado: [], noticias: [], createdAt: Date.now()
  };
}

function compressImageFile(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      try {
        var scale = Math.min(1, maxW / img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', quality));
      } catch(err){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}
function compressMany(files, maxW, quality, cb){
  var results = new Array(files.length); var remaining = files.length; var failed = 0;
  if (!remaining) return cb([]);
  Array.prototype.forEach.call(files, function(f, idx){
    compressImageFile(f, maxW, quality, function(dataUrl){
      results[idx] = dataUrl; if (!dataUrl) failed++;
      remaining--;
      if (remaining === 0) {
        if (failed) alert('No se pudieron procesar ' + failed + ' de ' + files.length + ' imagen(es) (formato no compatible o archivo dañado). El resto se guardó correctamente.');
        cb(results.filter(function(r){ return !!r; }));
      }
    });
  });
}

/* ================= RENDER ROOT ================= */
var app = document.getElementById('app');

function render(){
  var html = '';
  if (state.view === 'home') html = renderHome();
  else if (state.view === 'diario-list') html = renderDiarioList();
  else if (state.view === 'diario-form') html = renderDiarioForm();
  else if (state.view === 'calendario') html = renderCalendario();
  else if (state.view === 'estadisticas') html = renderEstadisticas();
  else if (state.view === 'impuestos') html = renderImpuestos();
  else if (state.view === 'mas') html = renderMas();
  else if (state.view === 'biblioteca-list') html = renderBibliotecaList();
  else if (state.view === 'biblioteca-study') html = renderBibliotecaStudy();
  else if (state.view === 'config') html = renderConfig();

  var deep = (state.view === 'diario-form' || state.view === 'biblioteca-study');
  app.style.paddingBottom = deep ? '10px' : '96px';
  html += deep ? '' : renderBottomNav();
  app.innerHTML = html;
  bindCommonEvents();
  if (state.view === 'home') bindHomeEvents();
  else if (state.view === 'diario-list') bindDiarioListEvents();
  else if (state.view === 'diario-form') bindDiarioFormEvents();
  else if (state.view === 'calendario') bindCalendarioEvents();
  else if (state.view === 'estadisticas') bindEstadisticasEvents();
  else if (state.view === 'impuestos') bindImpuestosEvents();
  else if (state.view === 'mas') bindMasEvents();
  else if (state.view === 'biblioteca-list') bindBibliotecaListEvents();
  else if (state.view === 'biblioteca-study') bindBibliotecaStudyEvents();
  else if (state.view === 'config') bindConfigEvents();
}

function goTo(view){ state.view = view; render(); }

/* ================= BOTTOM NAV ================= */
function renderBottomNav(){
  function item(key, ic, label){
    var active = state.view === key || (key==='mas' && ['impuestos','biblioteca-list','biblioteca-study','diario-list'].indexOf(state.view)>=0);
    return '<button class="navitem ' + (active?'active':'') + '" data-nav="' + key + '">' + icon(ic) + '<span>' + label + '</span></button>';
  }
  return ''
  + '<div class="bottomnav"><div class="bottomnav-inner">'
  +   item('home','home','Inicio')
  +   item('calendario','calendar','Calendario')
  +   '<div class="navplus"><button id="quick-add-btn">' + icon('plus') + '</button></div>'
  +   item('estadisticas','bar','Stats')
  +   item('mas','menu','Más')
  + '</div></div>';
}

function bindCommonEvents(){
  document.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.addEventListener('click', function(){ goTo(btn.getAttribute('data-nav')); });

  var quickAdd = document.getElementById('quick-add-btn');
  if (quickAdd) quickAdd.addEventListener('click', function(){
    state.editingOp = emptyOperation(currentAccount() ? currentAccount().name : 'Cuenta Demo');
    goTo('diario-form');
  });
}

/* ================= HOME ================= */
function computeAccountStats(acc){
  var ops = accountOps(acc.name);
  var deposit = state.movements.filter(function(m){return m.tipo==='Depósito';}).reduce(function(a,m){return a+m.monto;},0);
  var retiro = state.movements.filter(function(m){return m.tipo==='Retiro';}).reduce(function(a,m){return a+m.monto;},0);
  var profit = ops.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);
  var balance = (acc.balanceInicial||0) + deposit - retiro + profit;
  var events = state.movements.map(function(m){ return { t:new Date(m.fecha).getTime(), delta: m.tipo==='Depósito'?m.monto:-m.monto }; })
    .concat(ops.map(function(o){ return { t:new Date(o.fecha+'T'+(o.hora||'00:00')).getTime(), delta: parseFloat(o.beneficio)||0 }; }))
    .sort(function(a,b){return a.t-b.t;});
  var running = acc.balanceInicial||0, peak = running, maxDD = 0;
  events.forEach(function(e){ running += e.delta; peak = Math.max(peak, running); if (peak>0) maxDD = Math.max(maxDD, ((peak-running)/peak)*100); });
  return { ops: ops, balance: balance, profit: profit, drawdown: maxDD };
}

function renderHome(){
  var acc = currentAccount();
  if (!acc) return '<div class="empty">Crea una cuenta para empezar.</div>';
  var st = computeAccountStats(acc);
  var goalHtml = renderGoalCard(acc, st.balance);

  var wins = st.ops.filter(function(o){ return o.resultado==='Ganada'; }).length;
  var losses = st.ops.filter(function(o){ return o.resultado==='Perdida'; }).length;
  var be = st.ops.filter(function(o){ return o.resultado==='Break Even'; }).length;
  var winRate = st.ops.length ? Math.round((wins/st.ops.length)*100) : 0;
  var rrVals = st.ops.map(function(o){ return parseFloat(o.rr); }).filter(function(v){ return !isNaN(v); });
  var rrProm = rrVals.length ? (rrVals.reduce(function(a,v){return a+v;},0)/rrVals.length) : 0;

  return accountSwitcherBar()
  + '<div style="padding:22px 18px 0">'
  +   '<div class="label">Balance actual</div>'
  +   '<div style="font-size:36px;font-weight:800;letter-spacing:-0.5px;margin-top:4px">' + fmtMoney(st.balance, acc.currency) + '</div>'
  +   '<div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:' + (st.profit>=0?'var(--green)':'var(--red)') + '">'
  +     (st.profit>=0?icon('up'):icon('down')) + ' ' + fmtMoney(st.profit,acc.currency) + ' este mes'
  +   '</div>'
  + '</div>'
  + '<div style="padding:18px 18px 0">' + goalHtml + '</div>'

  + '<div style="padding:26px 18px 0"><h3 style="font-size:15px;font-weight:700;margin-bottom:14px">Resumen del mes</h3>'
  +   '<div class="stat-grid">'
  +     '<div class="card"><div class="label">Win Rate</div><div style="font-size:22px;font-weight:700;margin-top:4px;color:var(--green)">' + winRate + '%</div></div>'

function backupDataUrlToBlob(dataUrl){
  var parts = dataUrl.split(',');
  var mimeMatch = parts[0].match(/:(.*?);/);
  var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  var bin = atob(parts[1]);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function collectBackupData(){
  var data = {};
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.indexOf('hm_') === 0) {
      try { data[key] = JSON.parse(localStorage.getItem(key)); } catch(e){ data[key] = localStorage.getItem(key); }
    }
  }
  return imgGetAll().then(function(records){
    var images = {};
    records.forEach(function(r){ images[r.id] = r.dataUrl; });
    return { app: 'Hard Money SMC', version: 2, exportedAt: new Date().toISOString(), data: data, images: images };
  });
}
function estimateBackupSizeKB(cb){
  collectBackupData().then(function(backup){
    var kb = 0;
    try { kb = Math.round(new Blob([JSON.stringify(backup)]).size / 1024); } catch(e){}
    cb(kb);
  }).catch(function(){ cb(0); });
}
function buildBackupZip(){
  return collectBackupData().then(function(backup){
    var zip = new JSZip();
    var meta = { app: backup.app, version: backup.version, exportedAt: backup.exportedAt, data: backup.data, imageIds: Object.keys(backup.images) };
    zip.file('datos.json', JSON.stringify(meta));
    var imgFolder = zip.folder('images');
    Object.keys(backup.images).forEach(function(id){
      imgFolder.file(id + '.jpg', backupDataUrlToBlob(backup.images[id]));
    });
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  });
}
function downloadBackup(){
  buildBackupZip().then(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = 'HardMoneySMC_Backup_' + stamp + '.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }).catch(function(err){ alert('No se pudo generar el respaldo (' + (err && err.message ? err.message : 'error desconocido') + ').'); });
}
function restoreBackupFromFile(file){
  if (typeof JSZip === 'undefined') { alert('No se pudo cargar el componente necesario para leer el respaldo. Revisa tu conexión e intenta de nuevo.'); return; }
  JSZip.loadAsync(file).then(function(zip){
    var datosEntry = zip.file('datos.json');
    if (!datosEntry) throw new Error('El archivo .zip no contiene datos.json — no es un respaldo válido de Hard Money SMC.');
    return datosEntry.async('string').then(function(text){
      var parsed;
      try { parsed = JSON.parse(text); }
      catch(e){ throw new Error('datos.json dentro del zip está dañado (JSON inválido).'); }
      if (!parsed || !parsed.data || typeof parsed.data !== 'object') {
        throw new Error('El respaldo no tiene el formato esperado.');
      }
      var imageIds = parsed.imageIds || [];
      var imagesFolder = zip.folder('images');
      // Cargar y validar TODAS las imágenes en memoria antes de tocar nada guardado.
      var imageLoads = imageIds.map(function(id){
        var entry = imagesFolder.file(id + '.jpg');
        if (!entry) throw new Error('Falta la imagen "' + id + '" dentro del zip — el respaldo parece incompleto.');
        return entry.async('base64').then(function(b64){ return { id: id, dataUrl: 'data:image/jpeg;base64,' + b64 }; });
      });
      return Promise.all(imageLoads).then(function(images){ return { parsed: parsed, images: images }; });
    });
  }).then(function(result){
    var parsed = result.parsed, images = result.images;
    var keyCount = Object.keys(parsed.data).length;
    var imgCount = images.length;
    var lastRestore = lsGet('hm_last_restore_meta', null);
    var isDuplicate = lastRestore && parsed.exportedAt && lastRestore.exportedAt === parsed.exportedAt;
    var msg = 'Se van a reemplazar TODOS tus datos actuales (cuentas, operaciones, calendario, metas, impuestos, biblioteca SMC, checklists, ' + imgCount + ' imágenes) con este respaldo (del ' + (parsed.exportedAt ? parsed.exportedAt.slice(0,10) : 'fecha desconocida') + '). Esta acción no se puede deshacer. ¿Continuar?';
    if (isDuplicate) {
      msg = 'Este respaldo ya fue restaurado antes (el ' + parsed.exportedAt.slice(0,10) + '). Probablemente estés importando el mismo archivo por accidente.\n\n' + msg;
    }
    if (!confirm(msg)) return;
    // Recién ahora, con TODO ya validado y en memoria, se reemplazan los datos.
    var toRemove = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf('hm_') === 0) toRemove.push(k); }
    toRemove.forEach(function(k){ localStorage.removeItem(k); });
    Object.keys(parsed.data).forEach(function(k){
      localStorage.setItem(k, JSON.stringify(parsed.data[k]));
    });
    lsSet('hm_last_restore_meta', { exportedAt: parsed.exportedAt || null, restoredAt: Date.now() });
    var imgWrites = images.map(function(img){ return imgPut(img.id, img.dataUrl).catch(function(){}); });
    Promise.all(imgWrites).then(function(){
      alert('Respaldo restaurado correctamente (' + keyCount + ' registros, ' + imgCount + ' imágenes). La app se va a recargar.');
      location.reload();
    });
  }).catch(function(err){
    // Cualquier problema en la lectura/validación aborta ACÁ: hm_ todavía no se tocó.
    alert('No se pudo restaurar este respaldo: ' + (err && err.message ? err.message : 'archivo dañado o incompleto') + '\n\nTus datos actuales no fueron modificados.');
  });
}

  var del = document.getElementById('delete-op-btn'); if (del) del.addEventListener('click', function(){
    if (confirm('¿Eliminar esta operación?')) {
      state.operations = state.operations.filter(function(o){return o.id!==op.id;});
      saveOperations(state.operations); state.editingOp=null; goTo('diario-list');
    }
  });
  function bindVal(id,key){ var el=document.getElementById(id); if (el) el.addEventListener('input', function(){ op[key]=el.value; recalcRR(); }); }
  bindVal('f-fecha','fecha'); bindVal('f-hora','hora'); bindVal('f-lotaje','lotaje'); bindVal('f-riesgo','riesgo');
  bindVal('f-entrada','precioEntrada'); bindVal('f-sl','stopLoss'); bindVal('f-tp','takeProfit'); bindVal('f-rr','rr');
  bindVal('f-beneficio','beneficio'); bindVal('f-observaciones','observaciones'); bindVal('f-activoManual','activoManual');
  var cuentaSel = document.getElementById('f-cuenta'); if (cuentaSel) cuentaSel.addEventListener('change', function(){ op.cuenta = cuentaSel.value; });
  var catSel = document.getElementById('f-categoria'); if (catSel) catSel.addEventListener('change', function(){ op.categoria=catSel.value; if(op.categoria!=='Otro') op.activo=ASSETS[op.categoria][0]; render(); });
  var activoSel = document.getElementById('f-activo'); if (activoSel) activoSel.addEventListener('change', function(){ op.activo=activoSel.value; render(); });
  var dirSeg = document.getElementById('f-direccion'); if (dirSeg) dirSeg.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){op.direccion=b.getAttribute('data-val');render();});});
  var resSeg = document.getElementById('f-resultado'); if (resSeg) resSeg.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){op.resultado=b.getAttribute('data-val');render();});});
  var tipoSeg = document.getElementById('f-tipoEntrada'); if (tipoSeg) tipoSeg.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){op.tipoEntrada=b.getAttribute('data-val');op.checklist={};render();});});
  document.querySelectorAll('.chk-btn').forEach(function(b){b.addEventListener('click',function(){op.checklist[b.getAttribute('data-q')]=b.getAttribute('data-val')==='true';render();});});
  var save = document.getElementById('save-op-btn'); if (save) save.addEventListener('click', function(){
    var exists = state.operations.some(function(o){return o.id===op.id;});
    if (exists) state.operations = state.operations.map(function(o){return o.id===op.id?op:o;});
    else state.operations.unshift(op);
    saveOperations(state.operations); state.editingOp=null; goTo('diario-list');
  });
}
function recalcRR(){
  var op = state.editingOp;
  var e=parseFloat(op.precioEntrada), sl=parseFloat(op.stopLoss), tp=parseFloat(op.takeProfit);
  if (!isNaN(e)&&!isNaN(sl)&&!isNaN(tp)&&e!==sl) {
    var rr = Math.abs(tp-e)/Math.abs(e-sl);
    if (isFinite(rr)) { op.rr = rr.toFixed(2); var el=document.getElementById('f-rr'); if(el) el.value=op.rr; }
  }
}

/* ================= CALENDARIO ================= */
function renderCalendario(){
  var accNames = state.accounts.map(function(a){return a.name;});
  var scopedOps = state.calScope==='Todas' ? state.operations : state.operations.filter(function(o){return o.cuenta===state.calScope;});
  var byDay = {};
  scopedOps.forEach(function(o){ (byDay[o.fecha] = byDay[o.fecha]||[]).push(o); });

  var cursor = state.calCursor, year = cursor.getFullYear(), month = cursor.getMonth();
  var first = new Date(year,month,1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(year,month+1,0).getDate();
  var cells = []; for (var i=0;i<startWeekday;i++) cells.push(null); for (var d=1; d<=daysInMonth; d++) cells.push(d);
  function dateKey(d){ return year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

  var winDays=0, lossDays=0;
  Object.keys(byDay).forEach(function(k){
    if (k.indexOf(year+'-'+String(month+1).padStart(2,'0'))!==0) return;
    var total = byDay[k].reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);
    if (total>0) winDays++; else if (total<0) lossDays++;
  });
  var monthOps = scopedOps.filter(function(o){return o.fecha && o.fecha.indexOf(year+'-'+String(month+1).padStart(2,'0'))===0;});
  var monthProfit = monthOps.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);

  var cellsHtml = cells.map(function(d,idx){
    if (d===null) return '<div></div>';
    var key = dateKey(d); var ops = byDay[key];
    var total = ops ? ops.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0) : null;
    var tone = ops ? (total>0?'green':total<0?'red':'default') : null;
    var bg = tone==='green'?'var(--greenSoft)':tone==='red'?'var(--redSoft)':'var(--card)';
    var col = tone==='green'?'var(--green)':tone==='red'?'var(--red)':'var(--text)';
    var isToday = key === todayISO();
    return '<button class="daycell has-ops" data-daykey="' + key + '" style="background:'+bg+';color:'+col+';border-color:'+(isToday?'var(--gold)':'var(--border)')+'">'
      + d + (ops ? '<span class="dot" style="background:'+(tone==='green'?'var(--green)':tone==='red'?'var(--red)':'var(--textFaint)')+'"></span>' : '')
      + '</button>';
  }).join('');

  var chips = ['Todas'].concat(accNames).map(function(a){
    return '<button class="chip cal-chip ' + (state.calScope===a?'active':'') + '" data-cuenta="'+esc(a)+'">'+esc(a)+'</button>';
  }).join('');

  return '<div class="topbar"><button class="iconbtn" id="back-btn">'+icon('back')+'</button><h2 style="font-size:17px;font-weight:700">Calendario</h2></div>'
  + '<div style="display:flex;gap:8px;padding:16px 18px 0;overflow-x:auto">'+chips+'</div>'
  + '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0">'
  +   '<button class="iconbtn" id="cal-prev">'+icon('back')+'</button>'
  +   '<h3 style="font-size:16px;font-weight:800">'+MESES[month]+' '+year+'</h3>'
  +   '<button class="iconbtn" id="cal-next" style="transform:rotate(180deg)">'+icon('back')+'</button>'
  + '</div>'
  + '<div style="display:flex;gap:14px;justify-content:center;padding:10px 18px 0;font-size:12px;color:var(--textDim)">'
  +   '<span>🟢 '+winDays+' ganadores</span><span>🔴 '+lossDays+' perdedores</span>'
  + '</div>'
  + '<div style="padding:16px 18px 0">'
  +   '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">' + DIAS_SEMANA.map(function(dd){return '<div style="text-align:center;font-size:10.5px;color:var(--textFaint);font-weight:700">'+dd+'</div>';}).join('') + '</div>'
  +   '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">' + cellsHtml + '</div>'
  + '</div>'
  + '<div style="padding:22px 18px 0"><div class="card">'
  +   '<div class="label" style="margin-bottom:10px">Resumen del mes</div>'
  +   '<div style="display:flex;gap:16px">'
  +     '<div><div style="font-size:10.5px;color:var(--textDim)">Profit</div><div style="font-size:16px;font-weight:700;color:'+(monthProfit>=0?'var(--green)':'var(--red)')+'">'+fmtNum(monthProfit)+'</div></div>'
  +     '<div><div style="font-size:10.5px;color:var(--textDim)">Operaciones</div><div style="font-size:16px;font-weight:700">'+monthOps.length+'</div></div>'
  +   '</div>'
  + '</div></div>'

function openDayModal(dateKey){

      +   '<span style="font-weight:700;font-size:13.5px">'+esc(activo)+'</span></div>'
      +   '<span style="font-weight:700;font-size:13px;color:'+(b>=0?'var(--green)':'var(--red)')+'">'+fmtNum(b)+'</span></div>'
      + '<div style="font-size:11.5px;color:var(--textDim);margin-top:4px">'+esc(op.hora||'—')+' · '+esc(op.resultado)+' · '+esc(op.cuenta)+(op.rr?' · RR '+esc(op.rr):'')+'</div>'
      + '</div>';
  }).join('');
  openModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h2 style="font-size:18px;font-weight:700">'+esc(dateKey)+'</h2><span class="pill '+tone+'">'+fmtNum(total)+'</span></div>'
    + '<p style="color:var(--textDim);font-size:13px;margin-bottom:16px">'+ops.length+' operación'+(ops.length===1?'':'es')+' este día.</p>' + rows
    + '<button class="btn btn-primary" id="day-add-op-btn" style="width:100%;margin-top:6px">'+icon('plus')+' Registrar operación este día</button>');
  document.querySelectorAll('.day-op-row').forEach(function(row){
    row.addEventListener('click', function(){
      var op = state.operations.find(function(o){return o.id===row.getAttribute('data-op-id');});
      if (op) { closeModal(); openOperationForEdit(op); }
    });
  });
  var addBtn = document.getElementById('day-add-op-btn');
  if (addBtn) addBtn.addEventListener('click', function(){
    var newOp = emptyOperation(currentAccount() ? currentAccount().name : (state.accounts[0] ? state.accounts[0].name : ''));
    newOp.fecha = dateKey;
    state.editingOp = newOp;
    closeModal(); goTo('diario-form');
  });
}

/* ================= ESTADÍSTICAS ================= */
function renderEstadisticas(){
  var accNames = state.accounts.map(function(a){return a.name;});
  var scoped = state.statsScope==='Todas' ? state.operations : state.operations.filter(function(o){return o.cuenta===state.statsScope;});
  var total = scoped.length;
  var wins = scoped.filter(function(o){return o.resultado==='Ganada';}).length;
  var winRate = total?(wins/total*100):0;
  var rrVals = scoped.map(function(o){return parseFloat(o.rr);}).filter(function(v){return !isNaN(v);});
  var rrProm = rrVals.length ? rrVals.reduce(function(a,v){return a+v;},0)/rrVals.length : 0;
  var profitTotal = scoped.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);

  var sorted = scoped.slice().sort(function(a,b){return new Date(a.fecha+'T'+(a.hora||'00:00')) - new Date(b.fecha+'T'+(b.hora||'00:00'));});
  var running=0, peak=0, maxDD=0;
  sorted.forEach(function(o){ running += (parseFloat(o.beneficio)||0); peak=Math.max(peak,running); if(peak>0) maxDD=Math.max(maxDD, ((peak-running)/peak)*100); });

  var mejor=null, peor=null;
  scoped.forEach(function(o){
    var b = parseFloat(o.beneficio)||0;
    if (!mejor || b > (parseFloat(mejor.beneficio)||0)) mejor=o;
    if (!peor || b < (parseFloat(peor.beneficio)||0)) peor=o;
  });

  var now = new Date(); var months=[];
  for (var i=5;i>=0;i--) { var dt=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({key: dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'), label: MESES_CORTOS[dt.getMonth()]}); }
  var porMes = months.map(function(m){
    var ops = scoped.filter(function(o){return o.fecha && o.fecha.indexOf(m.key)===0;});
    var profit = ops.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);
    return { mes:m.label, count:ops.length, profit:profit };
  });
  var maxCount = Math.max(1, Math.max.apply(null, porMes.map(function(m){return m.count;})));
  var barsHtml = porMes.map(function(m){
    var h = Math.max(4, (m.count/maxCount)*90);
    return '<div class="barcol"><span style="font-size:9.5px;color:var(--textFaint)">'+(m.count||'')+'</span>'
      + '<div style="width:100%;max-width:26px;border-radius:5px;height:'+h+'px;background:'+(m.profit>=0?'var(--gold)':'var(--red)')+';opacity:'+(m.count?0.9:0.25)+'"></div>'
      + '<span style="font-size:10.5px;color:var(--textFaint);font-weight:600">'+m.mes+'</span></div>';
  }).join('');

  var porCuenta = state.accounts.map(function(a){
    var ops = state.operations.filter(function(o){return o.cuenta===a.name;});
    var profit = ops.reduce(function(s,o){return s+(parseFloat(o.beneficio)||0);},0);
    return { account:a, count: ops.length, profit: profit };
  }).filter(function(r){return r.count>0;});
  var maxCuentaCount = Math.max(1, Math.max.apply(null, porCuenta.map(function(r){return r.count;})||[1]));

  var chips = ['Todas'].concat(accNames).map(function(a){
    return '<button class="chip stats-chip ' + (state.statsScope===a?'active':'') + '" data-cuenta="'+esc(a)+'">'+esc(a)+'</button>';
  }).join('');

  if (total===0) {
    return '<div class="topbar"><button class="iconbtn" id="back-btn">'+icon('back')+'</button><h2 style="font-size:17px;font-weight:700">Estadísticas</h2></div>'
    + '<div style="display:flex;gap:8px;padding:16px 18px 0;overflow-x:auto">'+chips+'</div>'
    + '<div style="padding:18px"><div class="empty">Sin datos todavía. Registra operaciones en el Diario.</div></div>';
  }

  return '<div class="topbar"><button class="iconbtn" id="back-btn">'+icon('back')+'</button><h2 style="font-size:17px;font-weight:700">Estadísticas</h2></div>'
  + '<div style="display:flex;gap:8px;padding:16px 18px 0;overflow-x:auto">'+chips+'</div>'
  + '<div style="padding:16px 18px 0"><div class="stat-grid">'
  +   '<div class="card"><div class="label">Win Rate</div><div style="font-size:20px;font-weight:700;margin-top:4px;color:var(--green)">'+winRate.toFixed(0)+'%</div></div>'
  +   '<div class="card"><div class="label">RR Promedio</div><div style="font-size:20px;font-weight:700;margin-top:4px;color:var(--gold)">'+rrProm.toFixed(2)+'R</div></div>'
  +   '<div class="card"><div class="label">Profit Total</div><div style="font-size:20px;font-weight:700;margin-top:4px;color:'+(profitTotal>=0?'var(--green)':'var(--red)')+'">'+fmtNum(profitTotal)+'</div></div>'
  +   '<div class="card"><div class="label">Drawdown</div><div style="font-size:20px;font-weight:700;margin-top:4px;color:'+(maxDD>10?'var(--red)':'var(--text)')+'">'+maxDD.toFixed(1)+'%</div></div>'
  + '</div></div>'
  + '<div style="padding:12px 18px 0"><div class="stat-grid">'
  +   opHighlight('trophy','Mejor operación',mejor,true)
  +   opHighlight('skull','Peor operación',peor,false)
  + '</div></div>'
  + '<div style="padding:22px 18px 0"><h3 style="font-size:15px;font-weight:700;margin-bottom:12px">Operaciones por mes</h3>'
  +   '<div class="card"><div style="display:flex;align-items:flex-end;gap:8px;height:130px;padding:0 2px">'+barsHtml+'</div></div>'
  + '</div>'
  + (porCuenta.length ? '<div style="padding:22px 18px 0"><h3 style="font-size:15px;font-weight:700;margin-bottom:12px">Operaciones por cuenta</h3><div class="card" style="display:flex;flex-direction:column;gap:12px">'
  +   porCuenta.map(function(r){
        return '<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:600">'+esc(r.account.name)+'</span><span style="font-size:12px;color:'+(r.profit>=0?'var(--green)':'var(--red)')+';font-weight:700">'+fmtMoney(r.profit,r.account.currency)+'</span></div>'
          + '<div style="height:8px;border-radius:8px;background:var(--cardAlt);overflow:hidden"><div style="height:100%;width:'+((r.count/maxCuentaCount)*100)+'%;border-radius:8px;background:var(--gold)"></div></div>'
          + '<div style="font-size:10.5px;color:var(--textFaint);margin-top:3px">'+r.count+' operaciones</div></div>';
      }).join('')
  + '</div></div>' : '');
}
function opHighlight(ic,label,op,positive){
  if (!op) return '<div class="card"><div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;color:'+(positive?'var(--green)':'var(--red)')+'">'+icon(ic)+'<span class="label">'+label+'</span></div><div style="font-size:12.5px;color:var(--textFaint)">—</div></div>';
  var activo = op.activo==='Otro activo'?op.activoManual:op.activo;

    + '<div style="font-size:15px;font-weight:700">'+esc(activo)+'</div>'
    + '<div style="font-size:16px;font-weight:800;color:'+(positive?'var(--green)':'var(--red)')+';margin-top:2px">'+fmtNum(b)+'</div>'

}

function renderImpuestos(){
  var acc = currentAccount();
  if (!acc) return '<div class="empty">Crea una cuenta primero.</div>';

  var bruto = ops.reduce(function(a,o){return a+(parseFloat(o.beneficio)||0);},0);
  var estimado = bruto>0 ? bruto*(state.taxRate/100) : 0;
  var neto = bruto - estimado;
  var pagado = state.taxPayments.reduce(function(a,p){return a+p.cantidad;},0);
  var pendiente = Math.max(0, estimado - pagado);
  var presets = [10,15,20,25];
  var presetsHtml = presets.map(function(r){
    return '<button class="segrow-btn rate-preset ' + (state.taxRate===r?'active':'') + '" data-rate="'+r+'" style="flex:1;padding:9px 0;border-radius:12px;border:1px solid '+(state.taxRate===r?'var(--gold)':'var(--border)')+';background:'+(state.taxRate===r?'var(--goldSoft)':'var(--cardAlt)')+';color:'+(state.taxRate===r?'var(--gold)':'var(--textDim)')+';font-weight:700;font-size:13px;cursor:pointer">'+r+'%</button>';
  }).join('');

  var paymentsHtml = state.taxPayments.length===0
    ? '<div class="card" style="text-align:center;padding:28px 18px"><div style="color:var(--textFaint);margin-bottom:8px">'+icon('receipt')+'</div><div style="font-size:13px;color:var(--textDim)">Sin pagos registrados todavía.</div></div>'
    : state.taxPayments.map(function(p){
        return '<div style="display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px">'
          + '<div style="flex:1"><div style="font-size:13.5px;font-weight:700">'+fmtMoney(p.cantidad,acc.currency)+'</div><div style="font-size:11px;color:var(--textDim);margin-top:2px">'+esc(p.fecha)+(p.comentario?' · '+esc(p.comentario):'')+'</div></div>'
          + '<button class="iconbtn tax-del-btn" data-id="'+p.id+'" style="width:30px;height:30px;color:var(--textFaint)">'+icon('trash')+'</button></div>';
      }).join('');

  return accountSwitcherBar()
  + '<div style="padding:8px 18px 0"><div class="label">Impuestos</div><h1 style="font-size:22px;font-weight:800;margin-top:4px">Estimación fiscal</h1></div>'
  + '<div style="padding:16px 18px 0"><div class="card">'
  +   '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div class="label">Porcentaje de impuesto</div><div style="display:flex;align-items:center;gap:5px;color:var(--gold);font-weight:800;font-size:18px">'+icon('percent')+' '+state.taxRate+'</div></div>'
  +   '<div style="display:flex;gap:8px">'+presetsHtml+'<button id="rate-custom-btn" style="flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--border);background:var(--cardAlt);color:var(--textDim);font-weight:700;font-size:13px;cursor:pointer">Otro</button></div>'
  + '</div></div>'
  + '<div style="padding:14px 18px 0"><div class="card">'
  +   row('Beneficio bruto', fmtMoney(bruto,acc.currency), bruto>=0?'var(--green)':'var(--red)')
  +   '<div style="height:1px;background:var(--border);margin:2px 0"></div>'
  +   row('Impuesto estimado ('+state.taxRate+'%)', fmtMoney(estimado,acc.currency), 'var(--gold)')
  +   '<div style="height:1px;background:var(--border);margin:2px 0"></div>'
  +   row('Beneficio neto', fmtMoney(neto,acc.currency), 'var(--text)', true)
  + '</div></div>'
  + '<div style="padding:14px 18px 0"><div class="stat-grid">'
  +   '<div class="card"><div class="label">Pagado</div><div style="font-size:19px;font-weight:700;margin-top:4px;color:var(--green)">'+fmtMoney(pagado,acc.currency)+'</div></div>'
  +   '<div class="card"><div class="label">Pendiente</div><div style="font-size:19px;font-weight:700;margin-top:4px;color:'+(pendiente>0?'var(--red)':'var(--textDim)')+'">'+fmtMoney(pendiente,acc.currency)+'</div></div>'
  + '</div></div>'
  + '<div style="padding:22px 18px 0"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:15px;font-weight:700">Historial de pagos</h3><button class="iconbtn" id="add-payment-btn" style="width:30px;height:30px;color:var(--gold);background:var(--goldSoft)">'+icon('plus')+'</button></div>'+paymentsHtml+'</div>';

    b.addEventListener('click', function(){ state.studyRangeId = b.getAttribute('data-id'); render(); });
  });
  function addRange(){
    var r = emptyRange(); r.checklist = emptyChecklistAnswers(state.checklistTemplate);

      s[state.studyTF] = s[state.studyTF].filter(function(r){return r.id!==state.studyRangeId;});
      state.studyRangeId = null; persistCurrentStudy(); render();
    }
  });

  var delStudy = document.getElementById('delete-study-btn'); if (delStudy) delStudy.addEventListener('click', function(){
    if (confirm('¿Eliminar este estudio completo? No se puede deshacer.')) {
      deleteStudyStorage(s.id);
      state.studiesIndex = state.studiesIndex.filter(function(m){return m.id!==s.id;});
      saveStudiesIndex(state.studiesIndex);
      state.currentStudy = null; goTo('biblioteca-list');
    }
  });

  // range panel bindings
  var activeRange = state.studyTF==='h4' ? s.h4 : (s[state.studyTF]||[]).find(function(r){return r.id===state.studyRangeId;});
  if (!activeRange) return;

  var addImgBtn = document.getElementById('add-img-btn'); var fileInput = document.getElementById('img-file-input');
  if (addImgBtn && fileInput) {
    addImgBtn.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(){
      if (!fileInput.files.length) return;
      activeRange.images = activeRange.images || [];
      addImagesToArray(activeRange.images, fileInput.files, function(){ persistCurrentStudy(); render(); });
    });
  }
  document.querySelectorAll('.rm-img').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var idx = parseInt(b.getAttribute('data-idx'));
      removeImageFromArray(activeRange.images, idx);
      persistCurrentStudy(); render();
    });
  });
  document.querySelectorAll('.study-chk-btn').forEach(function(b){
    b.addEventListener('click', function(){
      activeRange.checklist[b.getAttribute('data-qid')] = b.getAttribute('data-val')==='true';
      persistCurrentStudy(); render();
    });
  });
  document.querySelectorAll('.study-chk-text').forEach(function(inp){
    inp.addEventListener('input', function(){ activeRange.checklist[inp.getAttribute('data-qid')] = inp.value; });
    inp.addEventListener('blur', function(){ persistCurrentStudy(); });
  });
  var obs = document.getElementById('range-obs');
  if (obs) { autoExpandTextarea(obs); obs.addEventListener('blur', function(){ activeRange.observaciones = obs.value; persistCurrentStudy(); }); }
}

<script>
/* =====================================================================
   HARD MONEY SMC — Sincronización con Supabase
   No modifica ninguna función existente: las "envuelve".
   ===================================================================== */
(function(){

  var BUCKET = 'Hard-money-SMC';

  /* ---------- utilidades ---------- */
  function numOrNull(v){ v = parseFloat(v); return isNaN(v) ? null : v; }

  function dataUrlToBlob(dataUrl){
    var parts = dataUrl.split(',');
    var mimeMatch = parts[0].match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  /* ---------- cola de sincronización (persistente en localStorage) ---------- */
  function queueGet(){ return lsGet('hm_sync_queue', []); }
  function queueSet(q){ lsSet('hm_sync_queue', q); }

  function syncEnqueue(table, action, payload){
    var q = queueGet();
    q.push({ table: table, action: action, payload: payload, ts: Date.now() });
    queueSet(q);
    processSyncQueue();
  }

  function runSyncItem(item){
    if (item.action === 'upsert') {
      return supabaseClient.from(item.table).upsert(item.payload).then(function(res){
        if (res.error) throw res.error;
      });
    }
    if (item.action === 'delete') {
      return supabaseClient.from(item.table).delete().eq('id', item.payload.id).then(function(res){
        if (res.error) throw res.error;
      });
    }
    return Promise.resolve();
  }

  var syncing = false;
  function processSyncQueue(){
    if (syncing) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    var q = queueGet();
    if (!q.length) return;
    syncing = true;
    var remaining = [];
    var chain = Promise.resolve();
    q.forEach(function(item){
      chain = chain.then(function(){
        return runSyncItem(item).catch(function(err){
          console.warn('Sync pendiente (' + item.table + '): ' + String(err && err.message ? err.message : err));
          remaining.push(item);
        });
      });
    });
    chain.then(function(){
      queueSet(remaining);
      syncing = false;
    });
  }

  // reintentar automáticamente al volver la conexión y cada 60s
  window.addEventListener('online', processSyncQueue);
  setInterval(processSyncQueue, 60000);
  setTimeout(processSyncQueue, 3000);

  /* ---------- subida de imágenes (IndexedDB -> Storage) ---------- */
  function syncUploadImage(imgId, pathPrefix){
    var uploaded = lsGet('hm_sync_uploaded_images', {});
    if (uploaded[imgId]) return Promise.resolve(uploaded[imgId]);
    return imgGet(imgId).then(function(dataUrl){
      if (!dataUrl) return null;
      var blob = dataUrlToBlob(dataUrl);
      var path = pathPrefix + '/' + imgId + '.jpg';
      return supabaseClient.storage.from(BUCKET)
        .upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' })
        .then(function(res){
          if (res.error) throw res.error;
          uploaded[imgId] = path;
          lsSet('hm_sync_uploaded_images', uploaded);
          return path;
        })
        .catch(function(err){
          console.warn('No se pudo subir imagen ' + imgId + ': ' + String(err && err.message ? err.message : err));
          return null;
        });
    });
  }

  /* ---------- diffing genérico para listas (detecta borrados) ---------- */
  function syncArrayDiff(table, list, keyField, mapFn, snapshotKey){
    var prevIds = lsGet(snapshotKey, []);
    var currentIds = (list || []).map(function(item){ return item[keyField]; });
    (list || []).forEach(function(item){ syncEnqueue(table, 'upsert', mapFn(item)); });
    prevIds.forEach(function(id){
      if (currentIds.indexOf(id) === -1) syncEnqueue(table, 'delete', { id: id });
    });
    lsSet(snapshotKey, currentIds);
  }

  /* ---------- mapeos por entidad ---------- */
  function accountRow(a){
    return { id: a.id, name: a.name, type: a.type, currency: a.currency, balance_inicial: numOrNull(a.balanceInicial) };
  }

  function operationRow(op){
    var acc = state.accounts.find(function(a){ return a.name === op.cuenta; });
    return {
      id: op.id, account_id: acc ? acc.id : null,
      fecha: op.fecha, hora: op.hora, categoria: op.categoria, activo: op.activo,
      activo_manual: op.activoManual, direccion: op.direccion, lotaje: numOrNull(op.lotaje),
      riesgo: numOrNull(op.riesgo), precio_entrada: numOrNull(op.precioEntrada),
      stop_loss: numOrNull(op.stopLoss), take_profit: numOrNull(op.takeProfit), rr: numOrNull(op.rr),
      resultado: op.resultado, beneficio: numOrNull(op.beneficio), tipo_entrada: op.tipoEntrada,
      checklist: op.checklist || {}, observaciones: op.observaciones, noticias: op.noticias || [],
      local_created_at: op.createdAt || null
    };
  }

  function syncOperationImages(op){
    var slots = { antes: op.imagenesAntes || [], durante: op.imagenesDurante || [], resultado: op.imagenesResultado || [] };
    var currentIds = [];
    Object.keys(slots).forEach(function(slot){
      slots[slot].forEach(function(imgId, idx){
        if (!imgId || String(imgId).indexOf('data:') === 0) return; // legado sin migrar, se omite
        currentIds.push(imgId);
        syncUploadImage(imgId, 'operations/' + op.id + '/' + slot).then(function(path){
          if (!path) return;
          syncEnqueue('operation_images', 'upsert', {
            id: imgId, operation_id: op.id, slot: slot, storage_path: path, orden: idx
          });
        });
      });
    });
    // detectar imágenes eliminadas de esta operación (en cualquier slot)
    var snapshotKey = 'hm_sync_snap_opimages_' + op.id;
    var prevIds = lsGet(snapshotKey, []);
    prevIds.forEach(function(id){
      if (currentIds.indexOf(id) === -1) syncEnqueue('operation_images', 'delete', { id: id });
    });
    lsSet(snapshotKey, currentIds);
  }

  function syncRange(studyId, timeframe, range, rangeId, orden){
    if (!range) return;
    syncEnqueue('study_ranges', 'upsert', {
      id: rangeId, study_id: studyId, timeframe: timeframe,
      checklist: range.checklist || {}, observaciones: range.observaciones, orden: orden
    });
    (range.images || []).forEach(function(imgId, idx){
      if (!imgId || String(imgId).indexOf('data:') === 0) return;
      syncUploadImage(imgId, 'studies/' + rangeId).then(function(path){
        if (!path) return;
        syncEnqueue('study_images', 'upsert', { id: imgId, study_range_id: rangeId, storage_path: path, orden: idx });
      });
    });
  }

  function syncStudy(study){
    syncEnqueue('studies', 'upsert', {
      id: study.id, par: study.par, fecha: study.fecha, estado: study.estado,
      local_created_at: study.createdAt || null
    });

    var h4Id = study.id + '_h4';
    syncRange(study.id, 'h4', study.h4, h4Id, 0);

    var rangeIds = [h4Id];
    (study.h1 || []).forEach(function(r, i){ syncRange(study.id, 'h1', r, r.id, i); rangeIds.push(r.id); });
    (study.m15 || []).forEach(function(r, i){ syncRange(study.id, 'm15', r, r.id, i); rangeIds.push(r.id); });

    // detectar rangos h1/m15 eliminados
    var snapshotKey = 'hm_sync_snap_ranges_' + study.id;
    var prevIds = lsGet(snapshotKey, []);
    prevIds.forEach(function(id){
      if (rangeIds.indexOf(id) === -1) syncEnqueue('study_ranges', 'delete', { id: id });
    });
    lsSet(snapshotKey, rangeIds);
  }

  /* ---------- envolver funciones existentes (sin tocarlas por dentro) ---------- */
  var _saveAccounts = saveAccounts;
  saveAccounts = function(a){
    _saveAccounts(a);
    syncArrayDiff('accounts', a, 'id', accountRow, 'hm_sync_snap_accounts');
  };

  var _saveOperations = saveOperations;
  saveOperations = function(ops){
    _saveOperations(ops);
    syncArrayDiff('operations', ops, 'id', operationRow, 'hm_sync_snap_operations');
    (ops || []).forEach(syncOperationImages);
  };

  var _saveMovements = saveMovements;
  saveMovements = function(accId, mv){
    _saveMovements(accId, mv);
    syncArrayDiff('movements', mv, 'id', function(m){
      return { id: m.id, account_id: accId, tipo: m.tipo, monto: numOrNull(m.monto), fecha: m.fecha, comentario: m.comentario };
    }, 'hm_sync_snap_movements_' + accId);
  };

  var _saveGoal = saveGoal;
  saveGoal = function(accId, g){
    _saveGoal(accId, g);
    if (g) {
      syncEnqueue('goals', 'upsert', { account_id: accId, meta: numOrNull(g.meta), local_created_at: g.createdAt || null });
    }
  };

  var _saveGoalHistory = saveGoalHistory;
  saveGoalHistory = function(accId, gh){
    _saveGoalHistory(accId, gh);
    syncArrayDiff('goal_history', gh, 'achievedAt', function(g){
      return {
        id: accId + '_' + g.achievedAt, account_id: accId,
        meta: numOrNull(g.meta), achieved_at: g.achievedAt || null, final_balance: numOrNull(g.finalBalance)
      };
    }, 'hm_sync_snap_goalhist_' + accId);
  };

  var _saveTaxRate = saveTaxRate;
  saveTaxRate = function(accId, r){
    _saveTaxRate(accId, r);
    syncEnqueue('tax_settings', 'upsert', { account_id: accId, rate: numOrNull(r) });
  };

  var _saveTaxPayments = saveTaxPayments;
  saveTaxPayments = function(accId, p){
    _saveTaxPayments(accId, p);
    syncArrayDiff('tax_payments', p, 'id', function(t){
      return { id: t.id, account_id: accId, fecha: t.fecha, cantidad: numOrNull(t.cantidad), comentario: t.comentario };
    }, 'hm_sync_snap_taxpay_' + accId);
  };

  var _saveStudy = saveStudy;
  saveStudy = function(study){
    _saveStudy(study);
    syncStudy(study);
  };

  var _deleteStudyStorage = deleteStudyStorage;
  deleteStudyStorage = function(id){
    _deleteStudyStorage(id);
    syncEnqueue('studies', 'delete', { id: id });
  };

  var _saveChecklistTemplate = saveChecklistTemplate;
  saveChecklistTemplate = function(t){
    _saveChecklistTemplate(t);
    syncEnqueue('checklist_templates', 'upsert', { id: 'default', questions: t || [] });
  };

  /* ---------- recuperación completa (dispositivo nuevo / perdiste el teléfono) ---------- */
  function syncPullAll(){
    return Promise.all([
      supabaseClient.from('accounts').select('*'),
      supabaseClient.from('operations').select('*'),
      supabaseClient.from('operation_images').select('*'),
      supabaseClient.from('goals').select('*'),
      supabaseClient.from('goal_history').select('*'),
      supabaseClient.from('tax_settings').select('*'),
      supabaseClient.from('tax_payments').select('*'),
      supabaseClient.from('studies').select('*'),
      supabaseClient.from('study_ranges').select('*'),
      supabaseClient.from('study_images').select('*'),
      supabaseClient.from('checklist_templates').select('*'),
      supabaseClient.from('movements').select('*')
    ]).then(function(results){
      var accounts = results[0].data || [];
      var operations = results[1].data || [];
      var opImages = results[2].data || [];
      var goals = results[3].data || [];
      var goalHist = results[4].data || [];
      var taxSettings = results[5].data || [];
      var taxPayments = results[6].data || [];
      var studies = results[7].data || [];
      var studyRanges = results[8].data || [];
      var studyImages = results[9].data || [];
      var templates = results[10].data || [];
      var movementsData = results[11].data || [];

      var localAccounts = accounts.map(function(a){
        return { id: a.id, name: a.name, type: a.type, currency: a.currency, balanceInicial: a.balance_inicial };
      });
      lsSet('hm_accounts', localAccounts);

      var accById = {}; localAccounts.forEach(function(a){ accById[a.id] = a; });
      var imagesByOp = {};
      opImages.forEach(function(img){
        imagesByOp[img.operation_id] = imagesByOp[img.operation_id] || { antes: [], durante: [], resultado: [] };
        imagesByOp[img.operation_id][img.slot].push(img);
      });
      var opImageDownloads = [];
      var localOps = operations.map(function(o){
        var slots = imagesByOp[o.id] || { antes: [], durante: [], resultado: [] };
        ['antes','durante','resultado'].forEach(function(slot){
          slots[slot].sort(function(x,y){ return x.orden - y.orden; });
          slots[slot].forEach(function(img){
            opImageDownloads.push(downloadImageToIndexedDb(img.id, img.storage_path));
          });
        });
        return {
          id: o.id, cuenta: accById[o.account_id] ? accById[o.account_id].name : '',
          fecha: o.fecha, hora: o.hora, categoria: o.categoria, activo: o.activo,
          activoManual: o.activo_manual, direccion: o.direccion, lotaje: o.lotaje, riesgo: o.riesgo,
          precioEntrada: o.precio_entrada, stopLoss: o.stop_loss, takeProfit: o.take_profit, rr: o.rr,
          resultado: o.resultado, beneficio: o.beneficio, tipoEntrada: o.tipo_entrada,
          checklist: o.checklist || {}, observaciones: o.observaciones, noticias: o.noticias || [],
          imagenesAntes: slots.antes.map(function(i){ return i.id; }),
          imagenesDurante: slots.durante.map(function(i){ return i.id; }),
          imagenesResultado: slots.resultado.map(function(i){ return i.id; }),
          createdAt: o.local_created_at || Date.now()
        };
      });
      lsSet('hm_operations', localOps);

      accounts.forEach(function(a){
        var g = goals.find(function(x){ return x.account_id === a.id; });
        lsSet('hm_goal_' + a.id, g ? { meta: g.meta, createdAt: g.local_created_at } : null);

        var gh = goalHist.filter(function(x){ return x.account_id === a.id; })
          .map(function(x){ return { meta: x.meta, achievedAt: x.achieved_at, finalBalance: x.final_balance }; });
        lsSet('hm_goal_history_' + a.id, gh);

        var ts = taxSettings.find(function(x){ return x.account_id === a.id; });
        lsSet('hm_taxrate_' + a.id, ts ? ts.rate : 15);

        var tp = taxPayments.filter(function(x){ return x.account_id === a.id; })
          .map(function(x){ return { id: x.id, fecha: x.fecha, cantidad: x.cantidad, comentario: x.comentario }; });
        lsSet('hm_taxpay_' + a.id, tp);

        var mv = movementsData.filter(function(x){ return x.account_id === a.id; })
          .map(function(x){ return { id: x.id, tipo: x.tipo, monto: x.monto, fecha: x.fecha, comentario: x.comentario }; });
        lsSet('hm_movements_' + a.id, mv);
      });

      var tpl = templates.find(function(t){ return t.id === 'default'; });
      if (tpl) lsSet('hm_checklist_template', tpl.questions);

      var rangesByStudy = {};
      studyRanges.forEach(function(r){
        rangesByStudy[r.study_id] = rangesByStudy[r.study_id] || [];
        rangesByStudy[r.study_id].push(r);
      });
      var imagesByRange = {};
      studyImages.forEach(function(img){
        imagesByRange[img.study_range_id] = imagesByRange[img.study_range_id] || [];
        imagesByRange[img.study_range_id].push(img);
      });

      var studyIndex = studies.map(function(s){
        var ranges = (rangesByStudy[s.id] || []).slice().sort(function(x,y){ return x.orden - y.orden; });
        var h4 = ranges.find(function(r){ return r.timeframe === 'h4'; });
        var h1 = ranges.filter(function(r){ return r.timeframe === 'h1'; });
        var m15 = ranges.filter(function(r){ return r.timeframe === 'm15'; });

        function buildRange(r){
          var imgs = (imagesByRange[r.id] || []).slice().sort(function(x,y){ return x.orden - y.orden; });
          imgs.forEach(function(img){ opImageDownloads.push(downloadImageToIndexedDb(img.id, img.storage_path)); });
          return { id: r.id, images: imgs.map(function(i){ return i.id; }), checklist: r.checklist || {}, observaciones: r.observaciones };
        }

        var study = {
          id: s.id, par: s.par, fecha: s.fecha, estado: s.estado, createdAt: s.local_created_at || Date.now(),
          h4: h4 ? buildRange(h4) : { images: [], checklist: {}, observaciones: '' },
          h1: h1.map(buildRange), m15: m15.map(buildRange)
        };
        lsSet('hm_study_' + s.id, study);
        return { id: s.id, par: s.par, fecha: s.fecha, estado: s.estado };
      });
      lsSet('hm_studies_index', studyIndex);

      return Promise.all(opImageDownloads);
    });
  }

  function downloadImageToIndexedDb(imgId, storagePath){
    return supabaseClient.storage.from(BUCKET).download(storagePath).then(function(res){
      if (res.error || !res.data) return null;
      return new Promise(function(resolve){
        var reader = new FileReader();
        reader.onload = function(){ imgPut(imgId, reader.result).then(function(){ resolve(true); }); };
        reader.onerror = function(){ resolve(false); };
        reader.readAsDataURL(res.data);
      });
    }).catch(function(){ return null; });
  }

  // Si el dispositivo está vacío (app nueva / reinstalada) y hay cuentas en la nube, recupera todo automáticamente
  setTimeout(function(){
    var localAccounts = lsGet('hm_accounts', []);
    if (localAccounts.length === 0) {
      supabaseClient.from('accounts').select('id').then(function(res){
        if (res.data && res.data.length > 0) {
          syncPullAll().then(function(){
            console.log('Datos recuperados desde Supabase.');
            if (typeof render === 'function') render();
          });
        }
      });
    }
  }, 1500);

  window.hmSyncPullAll = syncPullAll;
  window.hmProcessSyncQueue = processSyncQueue;

})();
</script>
